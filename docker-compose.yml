version: "3.9"

services:

  backend:
    build:
      context: ./django_server
      dockerfile: Dockerfile

    container_name: django-container

    ports:
      - "8000:8000"

    volumes:
      - ./django_server:/app
      - media_data:/app/doctorimg

    env_file:
      - ./django_server/.env

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./react_client
      dockerfile: Dockerfile

    container_name: react-container

    ports:
      - "3000:3000"

    volumes:
      - ./react_client:/app
      - react_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "3000"

    command: npm start

    depends_on:
      - backend

  db:
    image: postgres:17

    container_name: postgres-container

    environment:
      POSTGRES_DB: vaxhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis-container

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  celery_worker:
    build:
      context: ./django_server
      dockerfile: Dockerfile

    container_name: celery-worker

    volumes:
      - ./django_server:/app

    env_file:
      - ./django_server/.env

    command: celery -A django_server worker --loglevel=info

    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  react_node_modules:
  media_data: