version: "3.9"

services:
  backend:
    build: ./django_server
    container_name: django-container

    ports:
      - "8000:8000"

    volumes:
      - ./django_server:/app

    env_file:
      - ./django_server/.env

    command: >
      sh -c "python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
        "

  frontend:
    build: ./react_client
    container_name: react-container

    ports:
      - "3000:3000"

    volumes:
      - ./react_client:/app
      - react_node_modules:/app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "3000"
      WATCHPACK_POLLING: "true"

    command: >
      sh -c "mkdir -p /app/node_modules/.cache &&
             chmod -R 777 /app/node_modules &&
             npm start"

  nginx:
    build: ./nginx
    container_name: nginx-container

    ports:
      - "80:80"

    depends_on:
      - backend
      - frontend

volumes:
  react_node_modules: