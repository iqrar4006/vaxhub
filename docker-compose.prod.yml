version: "3.9"

services:
  backend:
    build:
      context: ./django_server
      dockerfile: Dockerfile.prod

    container_name: django-prod

    env_file:
      - ./django_server/.env

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn --bind 0.0.0.0:8000 django_server.wsgi:application
      "

    expose:
      - "8000"

    volumes:
      - media_data:/app/doctorimg

    restart: unless-stopped

    depends_on:
      - db
      - redis

  db:
    image: postgres:17

    container_name: postgres-container

    environment:
      POSTGRES_DB: vaxhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.prod

    container_name: nginx-prod

    ports:
      - "80:80"

    depends_on:
      - backend
      - db

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: redis-container

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

  celery_worker:
    build:
      context: ./django_server
      dockerfile: Dockerfile.prod

    container_name: celery-worker

    env_file:
      - ./django_server/.env

    command: celery -A django_server worker --loglevel=info

    depends_on:
      - backend
      - redis

    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  redis_data: